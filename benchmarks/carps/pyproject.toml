[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "leanhebo-carps"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.setuptools.packages.find]
include = ["leanhebo_carps*"]

[tool.setuptools.package-data]
leanhebo_carps = ["configs/**/*.yaml"]
