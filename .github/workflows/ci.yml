name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --all-groups --all-extras --python ${{ matrix.python }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src/leanhebo benchmarks
      - run: uv run --locked pytest --cov=leanhebo --cov-report=xml
      - run: uv run --locked pytest benchmarks/tests benchmarks/micro/benchmark_matched_search.py
      - run: uv build --no-sources
