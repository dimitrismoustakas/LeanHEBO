[project]
name = "leanhebo"
version = "0.1.0"
description = "A tensor-native, low-latency implementation of the HEBO method"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "LeanHEBO contributors" }]
keywords = ["bayesian-optimization", "gaussian-process", "hebo", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gpytorch>=1.14",
    "numpy>=2.0",
    "torch>=2.5",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2"]
polars = ["polars>=1.0"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pandas>=2.2",
    "polars>=1.0",
    "pre-commit>=3.7",
    "pymoo>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]
bench = [
    "asv>=0.6",
    "psutil>=6",
    "py-spy>=0.4",
    "pytest-benchmark>=4",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "leanhebo"
module-root = "src"
source-include = [
    "CHANGELOG.md",
    "CITATION.cff",
    "ORIGIN.md",
    "examples/**",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA-capable Torch installation",
    "performance: structural or timing performance tests",
]

[tool.coverage.run]
branch = true
source = ["leanhebo"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["leanhebo"]
mypy_path = "src"
